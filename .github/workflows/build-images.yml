name: Build and Push Docker Images
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
env:
  REGISTRY: reg.hcpss.org
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REG_USERNAME }}
          password: ${{ secrets.REG_PASSWORD }}

      - name: Extract version number from VERSION file
        id: version
        run: |
          VERSION=$(cat ./VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check if image tag exists
        id: check-image
        run: |
          TAG="${{ env.REGISTRY }}/schoolswap/web:${{ env.VERSION }}"
          if docker manifest inspect "$TAG" > /dev/null 2>&1; then
            echo "Image $TAG already exists. Skipping build."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image $TAG not found. Proceeding with build."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push drupal Docker image
        if: steps.check-image.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web/Dockerfile
          target: app
          build-args: |
            VERSION=${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/schoolswap/web:${{ env.VERSION }}
            ${{ env.REGISTRY }}/schoolswap/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push nginx Docker image
        if: steps.check-image.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web/Dockerfile
          target: nginx
          build-args: |
            VERSION=${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/schoolswap/nginx:${{ env.VERSION }}
            ${{ env.REGISTRY }}/schoolswap/nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
